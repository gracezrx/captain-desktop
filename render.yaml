# Render Blueprint: the Captain server (Docker) with a persistent disk for
# uploads. The database is yours (Supabase or any Postgres 14+): paste its
# address as DATABASE_URL when Render asks. Model keys can be pasted in the
# app afterwards (Settings → Models & spend), so they're optional here.
services:
  - type: web
    name: captain
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /readyz
    disk:
      name: captain-files
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        sync: false # Supabase: Connect → Session pooler (port 5432)
      - key: APP_SECRET
        generateValue: true # also encrypts saved model keys: don't change it later
      - key: INSTANCE_ADMINS
        sync: false # your email: you run the server and set model keys
      - key: PUBLIC_URL
        sync: false # e.g. https://captain.example.com (used in invite links)
      - key: CORS_ORIGINS
        value: tauri://localhost,http://tauri.localhost
      - key: OPEN_SIGNUP
        value: "true"
      - key: TRUST_PROXY
        value: "1" # Render's proxy sets X-Forwarded-For
      - key: OPENROUTER_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false

