# Builds the Mac app on a Mac (GitHub's macOS runner), so nobody needs Rust or
# Xcode locally. Run it from Actions → "Mac app" → Run workflow. With
# "release" on, the .dmg is attached to the "app-latest" release.
name: Mac app
on:
  workflow_dispatch:
    inputs:
      release:
        description: Attach the build to the app-latest release
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: mac-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            server/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install the app's packages
        working-directory: desktop
        run: npm ci

      - name: Build the app
        working-directory: desktop
        run: npm run tauri build -- --bundles app,dmg

      - name: Collect the files
        id: files
        run: |
          set -e
          out="$RUNNER_TEMP/captain"
          mkdir -p "$out"
          bundle=desktop/src-tauri/target/release/bundle
          ditto -c -k --keepParent "$bundle/macos/Captain.app" "$out/Captain-mac.zip"
          cp "$bundle"/dmg/*.dmg "$out/Captain.dmg"
          ls -la "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Captain-mac
          path: ${{ steps.files.outputs.dir }}
          retention-days: 14

      - name: Attach to the app-latest release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest --prerelease --target "$GITHUB_SHA" \
            --title "Captain for Mac (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download Captain.dmg, open it, and drag Captain to Applications. The first time, right-click Captain and choose Open (it isn't notarized yet)." \
            "${{ steps.files.outputs.dir }}/Captain.dmg" "${{ steps.files.outputs.dir }}/Captain-mac.zip"
