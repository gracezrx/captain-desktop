# Builds the Mac app on a Mac (GitHub's macOS runner), so nobody needs Rust or
# Xcode locally. Run it from Actions → "Mac app" → Run workflow. With
# "release" on, the .dmg is attached to the "app-latest" release.
name: Mac app
on:
  workflow_dispatch:
    inputs:
      release:
        description: Attach the build to the app-latest release
        type: boolean
        default: true
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: mac-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest # Apple Silicon
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            server/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install the app's packages
        working-directory: desktop
        run: npm ci

      - name: Build the app
        working-directory: desktop
        run: |
          set -o pipefail
          npm run tauri build -- --bundles app,dmg 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Build logs aren't always easy to reach: put the end of a failed build,
      # and the warnings of a good one, where the run's summary shows them.
      - name: Report the build
        if: always()
        run: |
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || exit 0
          enc() { sed 's/%/%25/g; s/\r//g' | awk 'BEGIN{ORS="%0A"} {print}'; }
          if grep -q "Finished" "$log" && [ -d desktop/src-tauri/target/release/bundle/macos/Captain.app ]; then
            echo "::notice title=Rust warnings::$(grep -A6 '^warning' "$log" | head -80 | enc)"
          else
            echo "::error title=Build output::$(grep -v '^\s*Compiling ' "$log" | tail -n 70 | enc)"
          fi

      - name: Collect the files
        id: files
        run: |
          set -e
          out="$RUNNER_TEMP/captain"
          mkdir -p "$out"
          bundle=desktop/src-tauri/target/release/bundle
          app="$bundle/macos/Captain.app"
          test -f "$app/Contents/Resources/server/dist/src/main.js" || { echo "::error::The built-in server is missing from the app"; exit 1; }
          ditto -c -k --keepParent "$app" "$out/Captain-mac.zip"
          cp "$bundle"/dmg/*.dmg "$out/Captain.dmg"
          codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier" || true
          echo "::notice title=Sizes::app $(du -sh "$app" | cut -f1), dmg $(du -h "$out/Captain.dmg" | cut -f1), zip $(du -h "$out/Captain-mac.zip" | cut -f1)"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Captain-mac
          path: ${{ steps.files.outputs.dir }}
          retention-days: 14

      - name: Attach to the app-latest release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest --prerelease --target "$GITHUB_SHA" \
            --title "Captain for Mac (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Download Captain.dmg, open it, and drag Captain to Applications. The first time, right-click Captain and choose Open (it isn't notarized yet)." \
            "${{ steps.files.outputs.dir }}/Captain.dmg" "${{ steps.files.outputs.dir }}/Captain-mac.zip"
